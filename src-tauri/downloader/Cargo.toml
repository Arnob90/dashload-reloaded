[package]
name = "dashload-downloader"
version = "0.2.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
bytes = "1.12.1"
console-subscriber = "0.5.0"
content_disposition = "0.4.0"
dashmap = "6.1.0"
digest = "0.11.3"
env_logger = "0.11.11"
futures = "0.3.31"
hex = "0.4.3"
log = "0.4.28"
md-5 = "0.11.0"
rand = "0.10.3"
reqwest = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
test-log = "0.2.18"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
log = "0.4.28"
test-log = "0.2.18"
wiremock = "0.6.5"
tempfile = "3.15"
ctor = "1.0.13"

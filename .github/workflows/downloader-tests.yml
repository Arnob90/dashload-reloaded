name: Downloader Integration Tests

on:
  push:
    branches: [master]
  workflow_dispatch: 
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The crate's .cargo/config.toml uses the mold linker, which is not installed
  # on GitHub-hosted runners. Override RUSTFLAGS so the build falls back to the
  # default linker while keeping the Tokio unstable cfg required by
  # console-subscriber.
  RUSTFLAGS: "--cfg tokio_unstable"

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src-tauri/downloader

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/downloader -> target

      - name: Run integration tests
        run: cargo test --locked 
